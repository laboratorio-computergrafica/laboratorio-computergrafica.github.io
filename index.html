<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Laboratorio di Computergrafica</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="hero">
        <h1 class="hero-title">Laboratorio di Computer Grafica</h1>
      </section>
      <section class="sections-grid">
        <div class="section-card">
          <img
            class="section-icon"
            src="assets/icon-3d.png"
            alt="Descrizione immagine 1"
          />
          <div class="section-title">C1</div>
          <div class="section-description">
            Tecniche 3D per modellare, visualizzare e costruire ambienti
            digitali
          </div>
        </div>
        <div class="section-card">
          <img
            class="section-icon"
            src="assets/icon-infodesign.svg"
            alt="Descrizione immagine 2"
          />
          <div class="section-title">C2</div>
          <div class="section-description">
            Approcci computazionali per comunicare visivamente dati e
            informazioni
          </div>
        </div>
        <div class="section-card">
          <img
            class="section-icon"
            src="assets/icon-gamedesign.png"
            alt="Descrizione immagine 3"
          />
          <div class="section-title">C3</div>
          <div class="section-description">
            Teoria del gioco, asset e programmazione per esperienze interattive
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
